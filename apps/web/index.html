<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>AMIN CHAT</title>
    <script>
      // Set language and direction before the first paint so there is no RTL/LTR flash.
      (function () {
        try {
          var l = localStorage.getItem('aminchat.locale');
          if (l !== 'fa' && l !== 'en') l = /^fa\b/i.test(navigator.language || '') || !navigator.language ? 'fa' : 'en';
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
