# Every push and pull request: install from the lockfile on a clean machine, type-check, run ALL tests, build the web app.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exactly what package-lock.json says)
        run: npm ci
      - name: Type-check (shared, api, web)
        run: npm run typecheck
      - name: Tests (scripts + relay, API on workerd, web)
        run: npm test
      - name: Build the web app
        run: npm run build
