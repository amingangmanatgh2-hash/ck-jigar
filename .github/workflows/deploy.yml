# Manual ("Run workflow"): publishes AMIN CHAT to YOUR Cloudflare account — web app, Worker, database and file bucket — and shows the
# address of the live service at the top of the run page.
#
# One-time setup. The easiest way is ONE repository secret (Settings > Secrets and variables > Actions > New repository secret) named
# DEPLOY_ENV whose value is these lines, one per line, no quotes (CF_ACCOUNT_ID / CF_API_TOKEN are accepted as shorter spellings):
#     CLOUDFLARE_ACCOUNT_ID=...   CLOUDFLARE_API_TOKEN=...   GROQ_API_KEY=...   (the last one is optional)
# Or three separate repository secrets with those names; a separate secret wins over the same line in DEPLOY_ENV. What each one is:
#   CLOUDFLARE_ACCOUNT_ID   your account id (dashboard > Workers & Pages > Account Details > copy button)
#   CLOUDFLARE_API_TOKEN    My Profile > API Tokens > Create Token > template "Edit Cloudflare Workers" (it has Workers Scripts,
#                           Workers R2 Storage and Account Settings but NOT D1), then add one more row: Account > D1 > Edit
#   GROQ_API_KEY            optional: console.groq.com > API Keys > Create. A second AI service, next to Workers AI: it answers quick
#                           requests first and takes over when Workers AI is busy or its free allowance is spent. Without it the
#                           service runs on Workers AI alone.
# The names must match exactly. Before anything is published a preflight asks Cloudflare and Groq whether everything is in place
# (token, Workers, D1, R2, Groq) and lists ALL problems at once, with the fix for each; it prints no secret.
# Two things need no action from you any more: a new account has no workers.dev address, so the step "Prepare the account" registers a free
# one right before publishing (it says which name; to choose it yourself, open Workers & Pages in the dashboard once, before the run). And
# R2: it needs a payment method that not everybody can add, so when the account has not switched R2 on the service goes live WITHOUT file
# storage (sending files and photos is off, everything else works) and the run says so; switch R2 on later (Storage & databases > R2 >
# Overview > subscribe; free monthly allowance) and run again to add it. The free Workers plan is enough to try it, with two limits (10 ms
# of CPU per request, 100 000 requests a day) explained in docs/deploy.md; Workers Paid is the safer plan.
# Before the first run, put your own username in "ADMIN_USERNAMES" in apps/api/wrangler.jsonc, and register it as soon as the
# service is up (docs/deploy.md).
#
# Two ways to start it:
#   - Actions > Deploy to Cloudflare > Run workflow. GitHub shows that button only once this file is on the default branch (Main).
#   - Without any button and without merging anything: a commit that changes the file deploy/REQUEST, on Main or on an arena/* branch.
#     Line 1 of that file is "check" (the plan and the tests only; nothing is published, no secret is used) or "deploy".
#
# The first run creates the D1 database and the R2 bucket. Wrangler looks them up by name, so a re-run or an already existing one is
# never duplicated. Every later run applies the migrations first and deploys the new code after. Worker secrets (RELAY_SECRET,
# GOOGLE_*, SEARCH_*) live on Cloudflare, are set once and are not touched here. The exception is GROQ_API_KEY: when the repository
# secret exists it is stored as the Worker secret of the same name after each deployment (so rotating the key is: change the repository
# secret, run again); when it does not exist, whatever is stored on Cloudflare stays as it is.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      smoke_url:
        description: 'Only if you use your own domain: its address, e.g. https://chat.example.com. The workers.dev address is checked automatically.'
        required: false
        default: ''
  push:
    branches: [Main, 'arena/**']
    paths: ['deploy/REQUEST']

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: What was asked for
        id: ask
        run: |
          MODE=deploy
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then MODE=$(head -n 1 deploy/REQUEST | tr -d '[:space:]'); fi
          case "$MODE" in
            deploy|check) ;;
            *) echo "::error title=deploy/REQUEST::line 1 must be check or deploy (it is: $MODE)"; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: **$MODE**" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show the plan (also stops here when ADMIN_USERNAMES names somebody who can never register)
        run: |
          set -o pipefail
          npm run deploy -- --dry-run 2>&1 | tee plan.log
      - name: Read the optional single secret DEPLOY_ENV (one paste instead of three secrets)
        id: bundle
        if: steps.ask.outputs.mode == 'deploy'
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: node scripts/load-deploy-env.mjs
      - name: Preflight (is everything in place? all problems at once, no secret printed)
        id: preflight
        if: steps.ask.outputs.mode == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || steps.bundle.outputs.account }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || steps.bundle.outputs.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || steps.bundle.outputs.groq }}
        run: |
          set -o pipefail
          npm run preflight 2>&1 | tee preflight.log
      - name: Tests first (nothing is published when one fails)
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Prepare the account (a workers.dev address, when the account has none)
        id: account
        if: steps.ask.outputs.mode == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || steps.bundle.outputs.account }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || steps.bundle.outputs.token }}
        run: |
          set -o pipefail
          npm run prepare:account 2>&1 | tee account.log
      - name: Deploy (build, then migrate and publish in the safe order)
        id: deploy
        if: steps.ask.outputs.mode == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || steps.bundle.outputs.account }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || steps.bundle.outputs.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || steps.bundle.outputs.groq }}
          AMIN_R2: ${{ steps.preflight.outputs.r2 }}
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
      - name: Address of the live service
        id: address
        if: success() && steps.ask.outputs.mode == 'deploy'
        env:
          AMIN_R2: ${{ steps.preflight.outputs.r2 }}
        run: |
          URL=$(sed -E 's/\x1b\[[0-9;]*m//g' deploy.log | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            if [ -n "$URL" ]; then
              echo "## AMIN CHAT is live: $URL"
              echo
              echo "Open it, register the username you put in ADMIN_USERNAMES (that account becomes the administrator), then open Models & usage (in Persian: مدل‌ها و مصرف) and press Check availability (بررسی دسترس‌پذیری); until a model passes that check it is never shown as ready."
            else
              echo "## Deployed"
              echo
              echo "Wrangler printed no workers.dev address (is workers_dev turned off or a custom domain used?). Check the log of the previous step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$URL" ]; then echo "::notice title=AMIN CHAT is live::$URL"; fi
          if [ "$AMIN_R2" = "off" ]; then
            { echo; echo "**File storage is OFF:** R2 is not switched on for this account, so sending files and photos is not available (everything else works). To add it: Cloudflare dashboard > Storage & databases > R2 > Overview > subscribe (it asks for a payment method; the monthly free allowance is enough), then run the deployment again."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=File storage is off::R2 is not switched on for this account, so the service is live without file storage. Switch R2 on and run the deployment again to add it."
          fi
          GROQ_LINES=$(sed -E 's/\x1b\[[0-9;]*m//g' deploy.log | grep -E '^\[deploy\] (WARNING: )?Groq' | cut -c1-400 || true)
          if [ -n "$GROQ_LINES" ]; then { echo; echo '```'; echo "$GROQ_LINES"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Check that it answers like AMIN CHAT
        if: success() && steps.ask.outputs.mode == 'deploy' && (inputs.smoke_url != '' || steps.address.outputs.url != '')
        env:
          TARGET: ${{ inputs.smoke_url || steps.address.outputs.url }}
          GROQ_PROVIDED: ${{ secrets.GROQ_API_KEY != '' || steps.bundle.outputs.groq != '' }}
        run: |
          # a new workers.dev address can take a minute to become reachable
          for i in $(seq 1 12); do
            if curl -fsS "${TARGET%/}/api/health" | tee health.json | grep -q '"service":"amin-chat"'; then
              echo; echo "OK: ${TARGET%/}/api/health"
              # which AI services does the live service have credentials for? (yes/no only; whether a model really answers is what
              # "Models & usage > Check availability" finds out after signing in)
              if [ "$GROQ_PROVIDED" = "true" ]; then
                for j in 1 2 3; do [ "$(jq -r '.ai.groq' health.json 2>/dev/null)" = "true" ] && break; sleep 5; curl -fsS "${TARGET%/}/api/health" > health.json || true; done
              fi
              WAI=$(jq -r '.ai["workers-ai"]' health.json 2>/dev/null || echo unknown)
              GROQ=$(jq -r '.ai.groq' health.json 2>/dev/null || echo unknown)
              echo "AI services with credentials on the live service: Workers AI=$WAI, Groq=$GROQ"
              {
                echo
                echo "| AI service | connected |"
                echo "|---|---|"
                echo "| Cloudflare Workers AI | $WAI |"
                echo "| Groq | $GROQ |"
                echo
                echo "\"connected\" means the service has credentials. Whether each model really answers is found out by the real test requests of **Models & usage → Check availability** (administrator)."
              } >> "$GITHUB_STEP_SUMMARY"
              [ "$WAI" = "true" ] || echo "::warning title=Workers AI::the live service has no Workers AI binding, so the main AI service is missing"
              if [ "$GROQ_PROVIDED" = "true" ] && [ "$GROQ" != "true" ]; then echo "::warning title=Groq::GROQ_API_KEY exists as a repository secret, but the live service does not show Groq as connected (see the Groq line of the deploy step)"; fi
              exit 0
            fi
            echo "not ready yet (attempt $i of 12)"; sleep 10
          done
          echo "::error::${TARGET%/}/api/health did not answer like AMIN CHAT"; exit 1
      - name: Check passed
        if: success() && steps.ask.outputs.mode == 'check'
        run: |
          echo "## Check passed: the plan is valid and every test is green. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Check passed::the plan is valid and every test is green; nothing was published"
      - name: Which secrets does this run see? (a yes or no per name; never a value)
        if: failure() && steps.preflight.outcome == 'failure'
        env:
          REPO: ${{ github.repository }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          S_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID != '' }}
          S_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID != '' }}
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          S_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN != '' }}
          S_CF_TOKEN: ${{ secrets.CF_TOKEN != '' }}
          S_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY != '' }}
          S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          S_GROQ_KEY: ${{ secrets.GROQ_KEY != '' }}
          S_DEPLOY_ENV: ${{ secrets.DEPLOY_ENV != '' }}
          B_ACCOUNT: ${{ steps.bundle.outputs.account != '' }}
          B_TOKEN: ${{ steps.bundle.outputs.token != '' }}
          B_GROQ: ${{ steps.bundle.outputs.groq != '' }}
        run: |
          # Only the names this project could plausibly be given are asked about, one by one: "does a secret with this name exist?".
          LINK="https://github.com/$REPO/settings/secrets/actions"
          FOUND=""
          for n in CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID ACCOUNT_ID CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CF_TOKEN CLOUDFLARE_API_KEY GROQ_API_KEY GROQ_KEY DEPLOY_ENV; do
            if [ "$(printenv "S_$n")" = "true" ]; then FOUND="$FOUND $n"; fi
          done
          FOUND="${FOUND# }"
          has() { case " $FOUND " in *" $1 "*) return 0 ;; esac; return 1; }
          ACCOUNT=NOT_FOUND; if has CLOUDFLARE_ACCOUNT_ID || has CF_ACCOUNT_ID; then ACCOUNT=found; elif [ "$B_ACCOUNT" = true ]; then ACCOUNT="found (a line of DEPLOY_ENV)"; fi
          TOKEN=NOT_FOUND; if has CLOUDFLARE_API_TOKEN || has CF_API_TOKEN; then TOKEN=found; elif [ "$B_TOKEN" = true ]; then TOKEN="found (a line of DEPLOY_ENV)"; fi
          GROQ=NOT_FOUND; if has GROQ_API_KEY; then GROQ=found; elif [ "$B_GROQ" = true ]; then GROQ="found (a line of DEPLOY_ENV)"; fi
          SEE="${FOUND// /, }"; [ -n "$SEE" ] || SEE="none of the expected names"
          EASIEST="Easiest: ONE secret named DEPLOY_ENV (open $LINK/new), whose value is the same lines you would write in a chat: CF_ACCOUNT_ID=...  CF_API_TOKEN=...  GROQ_API_KEY=... (one per line)."
          if [ "$ACCOUNT" != NOT_FOUND ] && [ "$TOKEN" != NOT_FOUND ]; then
            HINT="Both Cloudflare values reach the workflow, so the preflight message above is about their content, not their names."
          elif has DEPLOY_ENV; then
            HINT="A secret named DEPLOY_ENV exists, but it holds no usable line for everything this run needs: see the warnings of the step that reads it (they name the missing lines, never the values). Needed lines: CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID) and CLOUDFLARE_API_TOKEN (or CF_API_TOKEN), one per line, NAME=value."
          elif [ -z "$FOUND" ]; then
            HINT="No secret with a name this project uses reaches the workflow, so it was never saved, or saved somewhere else. It must be a REPOSITORY secret of $REPO (open $LINK, tab Actions, button New repository secret); Variables, Codespaces secrets and Dependabot secrets are not seen by this workflow. $EASIEST"
          else
            HINT="Some secrets exist, but not the two this run needs (CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN, or CF_ACCOUNT_ID and CF_API_TOKEN). GitHub cannot rename a secret: create it again under the right name at $LINK. $EASIEST"
          fi
          if has CLOUDFLARE_API_KEY && [ "$TOKEN" != found ]; then
            HINT="$HINT CLOUDFLARE_API_KEY is the old Global API Key, which this deployment does not use: create an API TOKEN (My Profile > API Tokens > Create Token)."
          fi
          echo "Secrets found under the names this project knows: $SEE"
          echo "CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID: $ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN or CF_API_TOKEN:   $TOKEN"
          echo "GROQ_API_KEY (optional):                $GROQ"
          echo "::warning title=Which secrets this run sees::Found: $SEE. Account id: $ACCOUNT. Token: $TOKEN. Groq key: $GROQ. $HINT"
          {
            echo "### Which secrets this run sees (names only; values are never read out)"
            echo
            echo "| Needed | State |"
            echo "|---|---|"
            echo "| CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID) | $ACCOUNT |"
            echo "| CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) | $TOKEN |"
            echo "| GROQ_API_KEY (optional) | $GROQ |"
            echo
            echo "Found under a name this project knows: $SEE"
            echo
            echo "$HINT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: What went wrong (the lines that matter, as annotations)
        if: failure()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          say() { # $1 = title, rest = text: one annotation, one line, percent signs escaped
            local t="$1"; shift; local x="$*"; x="${x//'%'/'%25'}"; echo "::error title=$t::${x:-no details; open the log of the red step}"
          }
          clean() { sed -E 's/\x1b\[[0-9;]*m//g' "$1" 2>/dev/null; }
          if [ -s deploy.log ]; then say "Deploy failed" "$(clean deploy.log | grep -E '✘|ERROR|Error|error|failed|nobody can register|Could not ask|WARNING' | head -n 8 | cut -c1-300 | tr '\n' '|')"; fi
          if [ -s preflight.log ] && ! [ -s test.log ]; then say "Nothing was published" "The preflight found problems: each one is its own annotation above, with the fix. Fix them (or the secrets), then run again."; fi
          if [ "$TESTS_OUTCOME" = "failure" ] && [ -s test.log ] && ! [ -s deploy.log ]; then say "Tests failed" "$(clean test.log | grep -E 'FAIL |not ok |AssertionError|Tests +[0-9]+ failed' | head -n 8 | cut -c1-300 | tr '\n' '|')"; fi
          if [ -s account.log ] && ! [ -s deploy.log ] && [ "$TESTS_OUTCOME" != "failure" ]; then say "Nothing was published" "$(clean account.log | grep -E '^\[address\]' | tail -n 3 | cut -c1-400 | tr '\n' '|')"; fi
          if [ -s plan.log ] && ! [ -s test.log ] && ! [ -s preflight.log ]; then say "The plan was refused" "$(clean plan.log | grep -E 'ADMIN_USERNAMES|nobody can register|Nothing was' | head -n 4 | cut -c1-400 | tr '\n' '|')"; fi
