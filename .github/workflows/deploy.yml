# Publishes the panel to the Cloudflare account behind the DEPLOY_ENV repository secret, then checks the live
# service: the page loads, the API refuses strangers, the right password is accepted, and the overview answers.
#
# Start it either from Actions → "Deploy panel" → Run workflow, or by changing deploy/REQUEST (line 1: "deploy").
name: Deploy panel

on:
  workflow_dispatch:
  push:
    branches: [Main, 'arena/**']
    paths: ['deploy/REQUEST']

concurrency:
  group: deploy-panel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        id: deploy
        run: node scripts/deploy.mjs
      - name: The deployment is registered
        id: where
        run: |
          URL=$(cat worker/.deployed-url | tr -d '[:space:]')
          if [ -z "$URL" ]; then echo "::error title=Address::the deployment did not report an address"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Panel: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the live service
        env:
          URL: ${{ steps.where.outputs.url }}
        run: |
          set -euo pipefail
          echo "checking $URL"
          sleep 4
          code=$(curl -sS -o /tmp/page.html -w '%{http_code}' "$URL/?debug=1")
          echo "GET / → $code"
          if [ "$code" != "200" ]; then
            echo "--- body ---"; head -c 2000 /tmp/page.html; echo
            snippet=$(head -c 700 /tmp/page.html | tr '\n\r' '  ')
            echo "::error title=Page answered $code::$snippet"
            exit 1
          fi
          grep -q 'ZEUS LITE' /tmp/page.html || { echo "::error title=Page::the panel page did not load"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/me")
          [ "$code" = "401" ] || { echo "::error title=Auth::/api/me answered $code instead of 401"; exit 1; }

          jar=$(mktemp)
          if [ -n "${ADMIN_PASSWORD:-}" ]; then PASS="$ADMIN_PASSWORD"; else PASS="amin_ck"; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -X POST "$URL/api/auth" \
            -H 'Content-Type: application/json' -d "{\"password\":\"$PASS\"}")
          [ "$code" = "200" ] || { echo "::error title=Sign in::/api/auth answered $code — is the password right?"; exit 1; }

          code=$(curl -sS -o /tmp/me.json -w '%{http_code}' -b "$jar" "$URL/api/me")
          [ "$code" = "200" ] || { echo "::error title=Session::/api/me answered $code with a fresh session"; exit 1; }

          overview=$(curl -fsS -b "$jar" "$URL/api/overview")
          echo "$overview"
          echo "$overview" | grep -q '"users"' || { echo "::error title=Overview::no user count in the answer"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/sub/aaaaaaaaaaaaaaaaaaaaaaaa")
          [ "$code" = "404" ] || { echo "::error title=Subscription::an unknown token answered $code instead of 404"; exit 1; }
          echo "::notice title=Live::panel, sign in, session and subscription all answer as expected"
      - name: Why the Worker is unhappy (tail)
        if: failure()
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -uo pipefail
          TOKEN=$(printf '%s\n' "$DEPLOY_ENV" | sed -nE 's/^(CLOUDFLARE_API_TOKEN|CF_API_TOKEN)=//p' | head -1 | tr -d '\r' | tr -d '"' | tr -d "'")
          ACCOUNT=$(printf '%s\n' "$DEPLOY_ENV" | sed -nE 's/^(CLOUDFLARE_ACCOUNT_ID|CF_ACCOUNT_ID)=//p' | head -1 | tr -d '\r' | tr -d '"' | tr -d "'")
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          if [ -z "$TOKEN" ]; then echo "::error title=Tail::no token in DEPLOY_ENV"; exit 0; fi
          (cd worker && npx wrangler tail zeus-lite --format json > /tmp/tail.log 2>&1 &)
          sleep 12
          curl -sS -o /tmp/body.txt -w 'status %{http_code}\n' "https://zeus-lite.amin-ck.workers.dev/?debug=1"
          sleep 6
          pkill -f "wrangler tail" || true
          echo "--- what is deployed ---"
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/zeus-lite/content" -o /tmp/script.js || true
          echo "script bytes: $(wc -c < /tmp/script.js)"
          echo "has the new entry: $(grep -c 'zeus:' /tmp/script.js || true)"
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/zeus-lite/settings" -o /tmp/settings.json || true
          head -c 700 /tmp/settings.json
          echo "--- codes ---"
          for path in / /api/me /nope; do
            echo "$path → $(curl -sS -o /dev/null -w '%{http_code}' "https://zeus-lite.amin-ck.workers.dev$path")"
          done
          echo "--- tail ---"; head -c 1500 /tmp/tail.log
          flat=$(head -c 1200 /tmp/tail.log | tr '\n\r' ' ' | tr -d '"')
          echo "::error title=Worker tail::${flat:-(no events captured)}"
          echo "--- body ---"; head -c 400 /tmp/body.txt

      - name: What to write down
        run: |
          {
            echo ""
            echo "**Panel:** ${{ steps.where.outputs.url }}"
            echo ""
            echo "Open it, sign in (the password is the \`ADMIN_PASSWORD\` secret, or \`amin_ck\` when no secret is set) and change it from the 🔑 button."
          } >> "$GITHUB_STEP_SUMMARY"
