# Builds the Android app and puts the APK on the "Zeus Lite" GitHub release.
#
# The Xray core (`libv2ray.aar`, from 2dust/AndroidLibXrayLite) is downloaded here because it is a binary from
# another repository; the app itself is all in this one.
name: Android app

on:
  push:
    branches: [Main, 'arena/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: The Xray core
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          curl -fsSL --retry 3 -o android/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          ls -l android/app/libs

      - name: What the core offers
        run: |
          set -euo pipefail
          cd android/app/libs
          unzip -o -q libv2ray.aar classes.jar -d /tmp/core
          echo "--- Libv2ray"; javap -classpath /tmp/core/classes.jar libv2ray.Libv2ray || true
          echo "--- V2RayPoint"; javap -classpath /tmp/core/classes.jar libv2ray.V2RayPoint || true
          echo "--- V2RayVPNServiceSupportsSet"; javap -classpath /tmp/core/classes.jar libv2ray.V2RayVPNServiceSupportsSet || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Why the APK build failed
        if: failure()
        run: |
          body=$(grep -E "^e: |error:|What went wrong|Execution failed|Caused by|FAILURE:" /tmp/gradle.log 2>/dev/null | head -14 | tr '\n' ' ' | tr -s ' ')
          echo "::error title=Gradle::${body:-the build log was not written (the failure came before Gradle)}"
          tail -c 1200 /tmp/gradle.log 2>/dev/null || true

      - name: Collect it
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ZeusLite-1.0.0.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ZeusLite-apk
          path: out/ZeusLite-1.0.0.apk
          if-no-files-found: error

      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 --title "Zeus Lite 1.0.0" --notes "Android app (APK) and Windows app (setup.exe) for the Zeus Lite panel." || true
          gh release upload v1.0.0 out/ZeusLite-1.0.0.apk --clobber
