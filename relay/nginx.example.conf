# nginx in front of the relay (relay started with TRUST_PROXY=1 on 127.0.0.1:8080). Certificate: certbot or any other.
# Not run in the environment this was written in — check it with `nginx -t` on your server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    client_max_body_size 64m;          # same as the relay's MAX_BODY_MB

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;   # REPLACES what the client sent: the relay then sees the real address
        proxy_set_header   Upgrade $http_upgrade;          # WebSocket
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering    off;                            # streamed answers must not be held back
        proxy_request_buffering off;
        proxy_read_timeout 3600s;                          # a chat connection is idle most of the time
        proxy_send_timeout 3600s;
    }
}
